    }

    :root {

      overflow-x: hidden;
    }

    body::before {
      content: "";

      inset: 0;
      pointer-events: none;
      opacity: 0.035;

      padding: 24px 0 44px;
    }

    .hero {
      position: relative;
      padding: 18px 4px 26px;
      margin-bottom: 6px;
    }

    .hero::after {
      content: "";

      width: 110px;
      height: 2px;
      margin-top: 26px;
      background: var(--gold);
      box-shadow: 0 0 18px rgba(216,180,90,.45);

      height: 48px;

    .live-pill {

    .digit-card {
      text-align: center;

    .digit-circle {
      --digit-color: #2c98ee;
      position: relative;
      width: 82px;
      height: 82px;
      max-width: 100%;
      margin: auto;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 1000;
      border: 3px solid var(--digit-color);
      background: radial-gradient(circle at 34% 28%, #53bdff, #07548e 62%, #031d35);
      box-shadow:
        0 0 0 5px rgba(44,152,238,.08),
        0 0 24px rgba(44,152,238,.28),
        inset 0 0 20px rgba(255,255,255,.08);
      transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease,
        background .25s ease;
    }

    .digit-circle::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px dashed rgba(255,255,255,.14);
      pointer-events: none;
    }

    .digit-circle .digit-entry {
      position: absolute;
      left: 50%;
      bottom: -11px;
      transform: translateX(-50%);
      padding: 3px 7px;
      border-radius: 999px;
      background: #050505;
      border: 1px solid currentColor;
      color: #f7d76a;
      font-size: 8px;
      line-height: 1;
      letter-spacing: 1px;
      font-weight: 1000;
      box-shadow: 0 0 12px rgba(242,212,124,.35);
      opacity: 0;
      white-space: nowrap;
    }

    .digit-circle.spinning {
      animation: digitSpin 1.05s linear infinite, digitColor 2.8s linear infinite;
    }

    .digit-circle.spinning:nth-child(2n) {
      animation-duration: .82s, 2.1s;
    }

    @keyframes digitSpin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.08); }
      100% { transform: rotate(360deg) scale(1); }
    }

    @keyframes digitColor {
      0%,100% {
        filter: hue-rotate(0deg);
        box-shadow: 0 0 0 5px rgba(44,152,238,.08), 0 0 26px rgba(44,152,238,.35), inset 0 0 20px rgba(255,255,255,.08);
      }
      33% {
        filter: hue-rotate(90deg);
        box-shadow: 0 0 0 5px rgba(45,216,121,.08), 0 0 30px rgba(45,216,121,.42), inset 0 0 20px rgba(255,255,255,.08);
      }
      66% {
        filter: hue-rotate(180deg);
        box-shadow: 0 0 0 5px rgba(239,83,80,.08), 0 0 30px rgba(239,83,80,.42), inset 0 0 20px rgba(255,255,255,.08);
      }
    }

    .digit-circle.entry-selected {
      transform: scale(1.14);
      border-color: #f2d47c;
      box-shadow:
        0 0 0 6px rgba(242,212,124,.12),
        0 0 34px rgba(242,212,124,.65),
        inset 0 0 24px rgba(242,212,124,.12);
      filter: none !important;
      z-index: 3;
    }

    .digit-circle.entry-selected .digit-entry {
      opacity: 1;
    }

    .digit-circle.entry-secondary {
      border-color: #5de69a;
      box-shadow:
        0 0 0 5px rgba(93,230,154,.1),
        0 0 28px rgba(93,230,154,.45);
      filter: none !important;
    }

    .digit-circle.pulse {

    }

    .digit-circle.green {

    .digit-circle.yellow {

    .entry-dial::before {

    .entry-digits-grid {
      position: absolute;

    }

    .entry-digits-grid .digit-circle {

      margin: 0;
      font-size: 21px;

    .entry-digits-grid .digit-circle:nth-child(1) { left: 50%; top: 5%; }
    .entry-digits-grid .digit-circle:nth-child(2) { left: 77%; top: 13%; }
    .entry-digits-grid .digit-circle:nth-child(3) { left: 94%; top: 38%; }
    .entry-digits-grid .digit-circle:nth-child(4) { left: 94%; top: 68%; }
    .entry-digits-grid .digit-circle:nth-child(5) { left: 77%; top: 87%; }
    .entry-digits-grid .digit-circle:nth-child(6) { left: 50%; top: 95%; }
    .entry-digits-grid .digit-circle:nth-child(7) { left: 23%; top: 87%; }
    .entry-digits-grid .digit-circle:nth-child(8) { left: 6%; top: 68%; }
    .entry-digits-grid .digit-circle:nth-child(9) { left: 6%; top: 38%; }
    .entry-digits-grid .digit-circle:nth-child(10) { left: 23%; top: 13%; }

    .entry-digits-grid.spinning {
      animation: entryRingSpin 2.8s linear infinite;
    }

    .entry-digits-grid.spinning .digit-circle {
      animation: entryCircleCounterSpin 2.8s linear infinite, digitColor 2.1s linear infinite;
    }

    .entry-digits-grid.spinning .digit-circle:nth-child(2n) {
      animation-duration: 2.8s, 1.7s;
    }

    @keyframes entryRingSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes entryCircleCounterSpin {
      from { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
      50% { transform: translate(-50%, -50%) rotate(-180deg) scale(1.08); }
      to { transform: translate(-50%, -50%) rotate(-360deg) scale(1); }
    }

    .entry-center {
      position: absolute;
      z-index: 5;
      width: 132px;
      height: 132px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 3px;
      background:
        radial-gradient(circle at 35% 28%, #153e68, #06111f 68%, #02060d);
      border: 2px solid rgba(44,152,238,.78);
      box-shadow:
        0 0 0 7px rgba(44,152,238,.08),
        0 0 38px rgba(44,152,238,.35),
        inset 0 0 28px rgba(44,152,238,.12);
      text-align: center;
      pointer-events: none;
    }

    .entry-center-label {
      color: #8da6c0;
      font-size: 9px;
      font-weight: 1000;
      letter-spacing: 2px;
    }

    .entry-center-value {
      color: #ffffff;
      font-size: 43px;
      line-height: .95;
      font-weight: 1000;
      letter-spacing: 1px;
    }

    .entry-center-value.confirmed {
      color: #f2d47c;
      text-shadow: 0 0 18px rgba(242,212,124,.55);
      animation: entryCenterPulse 1.15s ease-in-out infinite;
      transform: scale(1.08);
    }

    @keyframes entryCenterPulse {
      0%,100% {
        transform: scale(1);
        text-shadow: 0 0 12px rgba(242,212,124,.35);
      }
      50% {
        transform: scale(1.08);
        text-shadow: 0 0 26px rgba(242,212,124,.8);
      }
    }

    .entry-center-value.waiting {
      color: #77bfff;
      font-size: 17px;
      letter-spacing: 1px;
    }

    .entry-note {
      text-align: center;
      color: #9fb2c9;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1.4px;
      margin-top: 2px;
    }

    .entry-status {
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: 900;
      opacity: 0.7;
      text-align: center;
    }

    .entry-contract {
      text-align: center;
      margin-top: 8px;
      font-size: 15px;
      font-weight: 900;
      opacity: 0.75;
    }

    .prediction {
      text-align: center;
      font-size: clamp(50px, 9vw, 90px);
      font-weight: 1000;
      letter-spacing: 5px;
      margin: 10px 0;
      line-height: 1;
    }

    .reason {
      text-align: center;
      max-width: 720px;
      margin: 15px auto;
      color: #cbd7e6;
      line-height: 1.5;
    }

    .manual-help {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      color: #d9e5f4;
      line-height: 1.5;
      font-size: 14px;
      text-align: center;
    }

    .timer {
      margin-top: 18px;
      text-align: center;
    }

    .timer-label {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
      opacity: 0.65;
    }

    .timer-value {
      margin-top: 4px;
      font-size: 52px;
      font-weight: 1000;
    }

    .timer.active .timer-value {
      color: #5de69a;
    }

    .timer.warning .timer-value {
      color: #ffd84d;
    }

    .timer.expired .timer-value {
      color: #ff5555;
    }

    .dont-trade {
      display: none;
      text-align: center;
      padding: 20px;
      border: 2px solid #c5293b;
      border-radius: 16px;
      background: rgba(125, 17, 34, 0.2);
    }

    .dont-trade.show {
      display: block;
    }

    .dont-title {
      font-size: 25px;
      font-weight: 1000;
      color: #ff5b67;
    }

    .dont-message {
      margin-top: 7px;
      opacity: 0.8;
    }

    .history-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 12px;
    }

    .win {
      color: #4de08c;
      font-weight: 900;
    }

    .loss {
      color: #ff5e69;
      font-weight: 900;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat {
      padding: 15px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      text-align: center;
    }

    .stat-number {
      font-size: 25px;

    }

    .stat-label {

    .locked {

    }

    .unlock-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-top: 10px;
    }

    .hidden {
      display: none !important;
    }

    .muted {
      opacity: 0.55;
    }

    .message {
      margin-top: 10px;

      text-align: center;

    }

    @media (max-width: 850px) {
      .momentum-grid {
        grid-template-columns: repeat(5, 1fr);
      }

        gap: 14px 8px;

    @media (max-width: 520px) {
      .momentum-grid {

      }

        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<script>
/* =========================================================
   STATE
========================================================= */

let socket = null;

let loggedIn = false;
let running = false;

let currentMarket = "";
let currentSymbol = "";
let currentContract = "ODD";
let currentPrecision = null;

let matchesUnlocked = false;

let ticks = [];
let digits = [];

let currentSignal = null;
let signalSequence = 0;

let entryTimer = null;
let entrySeconds = 0;

let reconnectTimer = null;
let reconnectAttempts = 0;

let pendingStart = false;
let intentionalSocketClose = false;

const MAX_DIGITS = 100;
const MIN_TICKS_FOR_ANALYSIS = 60;
const SIGNAL_SCORE_THRESHOLD = 82;
const MIN_TOP_DIGIT_RATE = 16;
const MIN_EDGE_OVER_BASE = 5;
const MIN_TOP_MARGIN = 3;


/* =========================================================
   DOM
========================================================= */

const loginSection =
  document.getElementById("loginSection");

const mainApp =
  document.getElementById("mainApp");

const loginMarket =
  document.getElementById("loginMarket");

const loginPassword =
  document.getElementById("loginPassword");

const loginButton =
  document.getElementById("loginButton");

const loginMessage =
  document.getElementById("loginMessage");

const marketSelect =
  document.getElementById("marketSelect");

const contractSelect =
  document.getElementById("contractSelect");

const barrierBox =
  document.getElementById("barrierBox");

const barrierSelect =
  document.getElementById("barrierSelect");

const startButton =
  document.getElementById("startButton");

const stopButton =
  document.getElementById("stopButton");

const connectionStatus =
  document.getElementById("connectionStatus");

const liveMarket =
  document.getElementById("liveMarket");

const momentumMarket =
  document.getElementById("momentumMarket");

const momentumGrid =
  document.getElementById("momentumGrid");

const entryContract =
  document.getElementById("entryContract");

const prediction =
  document.getElementById("prediction");

const entryDigitsGrid =
  document.getElementById("entryDigitsGrid");

const reason =
  document.getElementById("reason");

const manualHelp =
  document.getElementById("manualHelp");

const manualTradeButton =
  document.getElementById("manualTradeButton");

const timer =
  document.getElementById("timer");

const timerValue =
  document.getElementById("timerValue");

const dontTrade =
  document.getElementById("dontTrade");

const dontMessage =
  document.getElementById("dontMessage");

const tickCount =
  document.getElementById("tickCount");

const lastDigit =
  document.getElementById("lastDigit");

const analysisScore =
  document.getElementById("analysisScore");

const digitHistory =
  document.getElementById("digitHistory");

const tradeHistory =
  document.getElementById("tradeHistory");

const matchesOption =
  document.getElementById("matchesOption");

const matchesUnlockBox =
  document.getElementById("matchesUnlockBox");

const unlockMatches =
  document.getElementById("unlockMatches");

const matchesCode =
  document.getElementById("matchesCode");

const unlockMessage =
  document.getElementById("unlockMessage");


/* =========================================================
   MOMENTUM CIRCLES
========================================================= */

function createDigitCircle(digit, idPrefix, withPercent = false) {

  const circle = document.createElement("div");

  circle.className = "digit-circle blue";

  circle.id = `${idPrefix}${digit}`;

  const span = document.createElement("span");

  span.textContent = digit;

  circle.appendChild(span);

  if (idPrefix === "entryDigitCircle") {

    const entry = document.createElement("span");

    entry.className = "digit-entry";

    entry.textContent = "ENTRY";

    circle.appendChild(entry);
  }

  if (withPercent) {

    const wrapper = document.createElement("div");

    wrapper.className = "digit-card";

    wrapper.appendChild(circle);

    const label = document.createElement("div");

    label.className = "digit-label";

    label.id = `digitPercent${digit}`;

    label.textContent = "0.0%";

    wrapper.appendChild(label);

    return wrapper;
  }

  return circle;
}

function buildMomentumCircles() {

  momentumGrid.innerHTML = "";

  for (let digit = 0; digit <= 9; digit++) {
    momentumGrid.appendChild(
      createDigitCircle(digit, "digitCircle", true)
    );
  }
}

function buildEntryDigitCircles() {

  entryDigitsGrid.innerHTML = "";

  for (let digit = 0; digit <= 9; digit++) {
    entryDigitsGrid.appendChild(
      createDigitCircle(digit, "entryDigitCircle")
    );
  }
}

function setEntryDigitAnimation(active) {

  entryDigitsGrid.classList.toggle("spinning", active);

  entryDigitsGrid
    .querySelectorAll(".digit-circle")
    .forEach(circle => {
      circle.classList.toggle("spinning", active);
    });
}

const entryCenterLabel =
  document.getElementById("entryCenterLabel");

const entryCenterValue =
  document.getElementById("entryCenterValue");

function setEntryCenter(label, value, confirmed = false) {

  if (!entryCenterLabel || !entryCenterValue) {
    return;
  }

  entryCenterLabel.textContent =
    label || "ENTRY";

  entryCenterValue.textContent =
    value || "WAIT";

  entryCenterValue.classList.toggle(
    "confirmed",
    confirmed
  );

  entryCenterValue.classList.toggle(
    "waiting",
    !confirmed
  );
}

function clearEntryDigitHighlights() {

  entryDigitsGrid
    .querySelectorAll(".digit-circle")
    .forEach(circle => {
      circle.classList.remove(
        "entry-selected",
        "entry-secondary"
      );
    });

  setEntryCenter("ENTRY", "WAIT", false);
}

function showEntryDigits(predictedDigits) {

  clearEntryDigitHighlights();

  const list = Array.isArray(predictedDigits)
    ? predictedDigits
    : [];

  if (!list.length) {
    setEntryCenter("ENTRY", "WAIT", false);
    return;
  }

  list.forEach((digit, index) => {

    const circle =
      document.getElementById(
        `entryDigitCircle${digit}`
      );

    if (!circle) {
      return;
    }

    circle.classList.add(
      index === 0
        ? "entry-selected"
        : "entry-secondary"
    );
  });

  const strongest = list[0];

  // The prediction is displayed only in the exact center
  // of the circular entry dial.
  setEntryCenter(
    "GOOD DIGIT",
    String(strongest),
    true
  );
}

buildMomentumCircles();
buildEntryDigitCircles();
setEntryCenter("ENTRY", "WAIT", false);


/* =========================================================
   CONNECTION UI
========================================================= */

function setConnectionStatus(text, type = "wait") {

  connectionStatus.textContent = text;

  connectionStatus.className =
    `connection ${type}`;
}


/* =========================================================
   LOGIN
========================================================= */

loginButton.addEventListener("click", login);

loginPassword.addEventListener("keydown", (event) => {

  if (event.key === "Enter") {
    login();
  }

});

loginMarket.addEventListener("keydown", (event) => {

  if (event.key === "Enter") {
    login();
  }

});


async function login() {

  loginMessage.textContent = "";

  const market =
    loginMarket.value.trim();

  const password =
    loginPassword.value;

  if (!market || !password) {

    loginMessage.textContent =
      "Enter your market and password.";

    return;
  }

  loginButton.disabled = true;
  loginButton.textContent = "CONNECTING...";

  try {

    const response =
      await fetch("/api/login", {
        method: "POST",
        headers: {
          "Content-Type":
            "application/json"
        },
        credentials: "same-origin",
        body: JSON.stringify({
          market,
          password
        })
      });

    const data =
      await response.json().catch(() => ({}));

    if (!response.ok) {

      loginMessage.textContent =
        data.message ||
        "Login failed.";

      return;
    }

    loggedIn = true;

    loginSection.classList.add("hidden");
    mainApp.classList.remove("hidden");

    connectBrowserSocket();

  } catch (error) {

    console.error("Login error:", error);

    loginMessage.textContent =
      "Could not connect to server.";

  } finally {

    loginButton.disabled = false;
    loginButton.textContent =
      "OPEN ANALYZER";
  }
}


/* =========================================================
   BROWSER WEBSOCKET
========================================================= */

async function connectBrowserSocket() {

  if (!loggedIn) return;

  if (
    socket &&
    (
      socket.readyState === WebSocket.OPEN ||
      socket.readyState === WebSocket.CONNECTING
    )
  ) {
    return;
  }

  intentionalSocketClose = false;
  clearTimeout(reconnectTimer);
  setConnectionStatus("CONNECTING TO DERIV", "wait");

  try {
    /*
     * Use Deriv's public market-data WebSocket directly.
     * This avoids the browser -> Vercel -> Node -> Deriv WebSocket
     * hop, which is unreliable on serverless hosting.
     */
    socket = new WebSocket(
      "wss://api.derivws.com/trading/v1/options/ws/public"
    );
  } catch (error) {
    console.error("Deriv WebSocket setup error:", error);
    setConnectionStatus("CONNECTION ERROR", "wait");
    return;
  }

  socket.addEventListener("open", () => {

    reconnectAttempts = 0;

    setConnectionStatus("DERIV CONNECTED", "live");

    try {
      socket.send(JSON.stringify({
        active_symbols: "brief",
        req_id: 1
      }));

      if (pendingStart) {
        pendingStart = false;
        setTimeout(() => {
          if (socket && socket.readyState === WebSocket.OPEN) {
            startMarket();
          }
        }, 0);
      }
    } catch (error) {
      console.error("Deriv socket send error:", error);
      setConnectionStatus("CONNECTION ERROR", "wait");
    }
  });

  socket.addEventListener("message", (event) => {
    let data;

    try {
      data = JSON.parse(event.data);
    } catch (error) {
      console.warn("Invalid Deriv WebSocket message:", event.data);
      return;
    }

    /*
     * Convert Deriv's native messages into the small internal
     * messages already used by the entry engine.
     */
    if (data.msg_type === "active_symbols") {
      const symbols = Array.isArray(data.active_symbols)
        ? data.active_symbols
        : [];

      const markets = symbols
        .filter(item => {
          const name = String(item.underlying_symbol_name || "");
          return /volatility|jump/i.test(name);
        })
        .filter(item => item.underlying_symbol)
        .filter(item => item.is_trading_suspended !== 1)
        .map(item => ({
          name: item.underlying_symbol_name,
          symbol: item.underlying_symbol,
          pipSize: Number(item.pip_size || 0),
          precision: Number.isFinite(Number(item.pip_size))
            ? Math.max(0, Math.min(Math.round(-Math.log10(Number(item.pip_size))), 10))
            : null
        }))
        .sort((a,b) => a.name.localeCompare(b.name, undefined, {numeric:true, sensitivity:"base"}));

      populateMarkets(markets);

      if (pendingStart) {
        pendingStart = false;
        setTimeout(() => startMarket(), 0);
      }

      return;
    }

    if (data.msg_type === "tick" && data.tick) {
      const tick = data.tick;

      if (
        !running ||
        !currentSymbol ||
        tick.symbol !== currentSymbol
      ) {
        return;
      }

      processTick({
        type: "tick",
        market: currentMarket,
        symbol: tick.symbol,
        quote: tick.quote,
        epoch: tick.epoch,
        pipSize: Number(tick.pip_size || 0),
        precision: Number.isFinite(Number(tick.pip_size))
          ? Math.max(0, Math.min(Math.round(-Math.log10(Number(tick.pip_size))), 10))
          : null
      });

      return;
    }

    if (data.msg_type === "error" || data.error) {
      console.error("Deriv API error:", data.error || data);
      running = false;
      currentSymbol = "";
      stopCurrentSignal();
      clearTimer();
      startButton.disabled = false;
      marketSelect.disabled = false;
      contractSelect.disabled = false;
      setConnectionStatus("DERIV ERROR", "wait");
      showDontTrade(
        (data.error && data.error.message) ||
        "Deriv market data connection error."
      );
      return;
    }

    if (data.subscription && data.subscription.id && data.msg_type === "tick") {
      return;
    }
  });

  socket.addEventListener("close", () => {
    setConnectionStatus("DISCONNECTED FROM DERIV", "wait");
    currentSymbol = "";

    if (running) {
      running = false;
      showDontTrade("Deriv connection lost. Press START to reconnect.");
      stopCurrentSignal();
      clearTimer();
      startButton.disabled = false;
      marketSelect.disabled = false;
      contractSelect.disabled = false;
    }
  });

  socket.addEventListener("error", (error) => {
    console.error("Deriv WebSocket error:", error);
    setConnectionStatus("CONNECTION ERROR", "wait");
  });
}



/* =========================================================
   SERVER MESSAGES
========================================================= */

function handleServerMessage(data) {

  if (!data || typeof data !== "object") {
    return;
  }


  if (data.type === "hello") {

    return;
  }


  if (data.type === "markets") {

    populateMarkets(
      Array.isArray(data.markets)
        ? data.markets
        : []
    );

    return;
  }


  if (data.type === "market_connected") {

    currentMarket =
      data.market || "";

    currentSymbol =
      data.symbol || "";

    currentPrecision =
      Number.isInteger(data.precision)
        ? data.precision
        : null;

    liveMarket.textContent =
      currentMarket
        ? `LIVE • ${currentMarket}`
        : "LIVE MARKET";

    momentumMarket.textContent =
      currentMarket
        ? `All digit momentum from ${currentMarket}`
        : "Waiting for market...";

    setConnectionStatus(
      "DERIV LIVE",
      "live"
    );

    return;
  }


  if (data.type === "tick") {

    if (!running) {
      return;
    }

    if (
      !currentSymbol ||
      data.symbol !== currentSymbol
    ) {
      return;
    }

    processTick(data);

    return;
  }


  if (data.type === "market_stopped") {

    running = false;

    setEntryDigitAnimation(false);
    clearEntryDigitHighlights();

    currentSymbol = "";

    stopCurrentSignal();
    clearTimer();
    resetAnalysis();

    startButton.disabled = false;
    startButton.textContent = "START";
    startButton.classList.remove("stop");
    startButton.classList.add("start");
    stopButton.disabled = true;

    marketSelect.disabled = false;
    contractSelect.disabled = false;

    setConnectionStatus(
      "STOPPED",
      "wait"
    );

    return;
  }


  if (
    data.type === "market_error" ||
    data.type === "deriv_error"
  ) {

    console.error(
      "Server/Deriv error:",
      data
    );

    running = false;

    setEntryDigitAnimation(false);
    clearEntryDigitHighlights();

    currentSymbol = "";

    stopCurrentSignal();
    clearTimer();

    startButton.disabled = false;
    stopButton.disabled = true;

    marketSelect.disabled = false;
    contractSelect.disabled = false;

    setConnectionStatus(
      "MARKET ERROR",
      "wait"
    );

    showDontTrade(
      data.message ||
      "Deriv market data error. Wait before trading."
    );

    return;
  }
}


/* =========================================================
   MARKET SELECTOR
========================================================= */

function populateMarkets(markets) {

  const previous =
    marketSelect.value;

  marketSelect.innerHTML = "";

  if (!markets.length) {

    const option =
      document.createElement("option");

    option.value = "";

    option.textContent =
      "No Volatility / Jump markets available";

    marketSelect.appendChild(option);

    return;
  }


  for (const market of markets) {

    if (!market || !market.name) {
      continue;
    }

    const option =
      document.createElement("option");

    option.value =
      market.name;

    option.textContent =
      market.name;

    option.dataset.symbol =
      market.symbol || "";

    option.dataset.pipSize =
      market.pipSize || "";

    marketSelect.appendChild(option);
  }


  if (
    previous &&
    Array.from(
      marketSelect.options
    ).some(
      option =>
        option.value === previous
    )
  ) {

    marketSelect.value =
      previous;

  } else {

    marketSelect.selectedIndex = 0;
  }
}

startButton.addEventListener(

    if (running) {
      stopMarket();
      return;

    const market =
      marketSelect.value;

    if (!market) {
      alert("Please select a market.");

    if (
      !socket ||

    ) {
      pendingStart = true;
      connectBrowserSocket();

      setConnectionStatus(
        "CONNECTING TO DERIV",
        "wait"
      );

      return;
    }

    startMarket();
  }
);


function stopMarket() {

  pendingStart = false;
  running = false;

  stopCurrentSignal();
  clearTimer();
  resetAnalysis();

  setEntryDigitAnimation(false);
  clearEntryDigitHighlights();

  if (
    socket &&
    socket.readyState === WebSocket.OPEN &&
    currentSymbol
  ) {
    try {
      socket.send(JSON.stringify({
        forget_all: "ticks"
      }));
    } catch (error) {
      console.error("Deriv stop error:", error);
    }
  }

  currentSymbol = "";

  startButton.disabled = false;
  startButton.textContent = "START";
  startButton.classList.remove("stop");
  startButton.classList.add("start");

  stopButton.disabled = true;

  marketSelect.disabled = false;
  contractSelect.disabled = false;

  setConnectionStatus(
    socket && socket.readyState === WebSocket.OPEN
      ? "DERIV CONNECTED"
      : "DISCONNECTED FROM DERIV",
    socket && socket.readyState === WebSocket.OPEN
      ? "live"
      : "wait"
  );

  setEntryCenter("ENTRY", "WAIT", false);
  entryContract.textContent = "WAITING FOR SIGNAL";

/* =========================================================
   START MARKET
========================================================= */

function startMarket() {

  if (
    !socket ||
    socket.readyState !== WebSocket.OPEN
  ) {

    pendingStart = true;

    connectBrowserSocket();

    return;
  }


  const market =
    marketSelect.value;

  if (!market) {
    return;
  }


  /*
   * Completely fresh analysis.
   */

  stopCurrentSignal();
  clearTimer();
  resetAnalysis();

  currentMarket =
    market;

  currentSymbol = "";

  currentPrecision = null;

  running = true;

  setEntryDigitAnimation(true);
  clearEntryDigitHighlights();

  pendingStart = false;

  startButton.disabled = false;
  startButton.textContent = "STOP";
  startButton.classList.remove("start");
  startButton.classList.add("stop");
  stopButton.disabled = true;

  marketSelect.disabled = true;
  contractSelect.disabled = true;

  setConnectionStatus(
    "CONNECTING TO DERIV",
    "wait"
  );

  liveMarket.textContent =
    `CONNECTING • ${market}`;

  momentumMarket.textContent =
    `Waiting for fresh ${market} ticks...`;

  hideDontTrade();


  try {
    const selectedOption =
      marketSelect.options[marketSelect.selectedIndex];

    const symbol =
      selectedOption?.dataset?.symbol || "";

    if (!symbol) {
      throw new Error("Deriv market symbol is not available yet.");
    }

    currentSymbol = symbol;

    currentMarket = market;

    setConnectionStatus(
      "SUBSCRIBING TO DERIV",
      "wait"
    );

    socket.send(
      JSON.stringify({
        ticks: symbol,
        subscribe: 1,
        req_id: Date.now()
      })
    );

    liveMarket.textContent =
      "LIVE • " + market;

    momentumMarket.textContent =
      "Live ticks from " + market;

    setConnectionStatus(
      "DERIV LIVE",
      "live"
    );

  } catch (error) {

    console.error(
      "Unable to start market:",
      error
    );

    running = false;

    startButton.disabled = false;
    stopButton.disabled = true;

    marketSelect.disabled = false;
    contractSelect.disabled = false;

    showDontTrade(
      "Could not start the market connection."
    );

  }
}

/* =========================================================
   PROCESS TICK
========================================================= */

function processTick(data) {

  ticks.push(data);

  if (
    ticks.length > MAX_DIGITS
  ) {

    ticks.shift();
  }


  const precision =
    Number.isInteger(data.precision)
      ? data.precision
      : currentPrecision;


  const digit =
    getLastDigit(
      data.quote,
      precision
    );


  if (digit === null) {
    return;
  }


  digits.push(digit);

  if (
    digits.length > MAX_DIGITS
  ) {

    digits.shift();
  }


  tickCount.textContent =
    digits.length;

  lastDigit.textContent =
    digit;

  updateMomentum();
  renderDigitHistory();


  /*
   * Analyze only when enough fresh ticks exist.
   *
   * IMPORTANT:
   * A signal is not recreated repeatedly from the
   * same history after expiry. A fresh analysis cycle
   * begins only after enough new ticks are collected.
   */

  if (
    digits.length >= MIN_TICKS_FOR_ANALYSIS &&
    !currentSignal
  ) {

    analyzeForEntry();
  }
}


/* =========================================================
   LAST DIGIT
========================================================= */

function getLastDigit(
  quote,
  precision
) {

  if (
    quote === null ||
    quote === undefined
  ) {

    return null;
  }


  let text = "";


  const numeric =
    Number(quote);


  if (
    Number.isFinite(numeric) &&
    Number.isInteger(precision) &&
    precision >= 0 &&
    precision <= 10
  ) {

    text =
      numeric.toFixed(precision);

  } else {

    text =
      String(quote);
  }


  for (
    let i = text.length - 1;
    i >= 0;
    i--
  ) {

    if (
      text[i] >= "0" &&
      text[i] <= "9"
    ) {

      return Number(text[i]);
    }
  }


  return null;
}


/* =========================================================
   DIGIT PERCENTAGES
========================================================= */

function getDigitPercentages() {

  const counts =
    Array(10).fill(0);

  for (const digit of digits) {

    if (
      Number.isInteger(digit) &&
      digit >= 0 &&
      digit <= 9
    ) {

      counts[digit]++;
    }
  }


  const total =
    digits.length;


  return counts.map(
    count =>
      total
        ? (count / total) * 100
        : 0
  );
}


/* =========================================================
   MOMENTUM SCORES
========================================================= */

function getMomentumScores() {

  const percentages =
    getDigitPercentages();


  const recent =
    digits.slice(-20);


  const recentCounts =
    Array(10).fill(0);


  for (const digit of recent) {

    recentCounts[digit]++;
  }


  const recentTotal =
    recent.length;


  const recentPercentages =
    recentCounts.map(
      count =>
        recentTotal
          ? (count / recentTotal) * 100
          : 0
    );


  return percentages.map(
    (value, digit) =>
      value * 0.55 +
      recentPercentages[digit] * 0.45
  );
}


/* =========================================================
   UPDATE MOMENTUM
========================================================= */

function updateMomentum() {

  const scores =
    getMomentumScores();


  const max =
    Math.max(...scores);


  scores.forEach(
    (score, digit) => {

      const circle =
        document.getElementById(
          `digitCircle${digit}`
        );

      const percent =
        document.getElementById(
          `digitPercent${digit}`
        );


      percent.textContent =
        `${score.toFixed(1)}%`;


      circle.classList.remove(
        "green",
        "blue",
        "yellow",
        "red"
      );


      const relative =
        max > 0
          ? score / max
          : 0;


      if (relative >= 0.75) {

        circle.classList.add(
          "green"
        );

      } else if (relative >= 0.50) {

        circle.classList.add(
          "blue"
        );

      } else if (relative >= 0.30) {

        circle.classList.add(
          "yellow"
        );

      } else {

        circle.classList.add(
          "red"
        );
      }


      circle.classList.add(
        "pulse"
      );


      setTimeout(() => {

        circle.classList.remove(
          "pulse"
        );

      }, 180);

    }
  );
}


/* =========================================================
   ANALYZE CONTRACT
========================================================= */

function analyzeForEntry() {

  if (
    digits.length <
    MIN_TICKS_FOR_ANALYSIS
  ) {

    return;
  }


  const scores =
    getMomentumScores();


  const ranked =
    scores
      .map(
        (score, digit) => ({
          digit,
          score
        })
      )
      .sort(
        (a, b) =>
          b.score - a.score
      );

  // Conservative anti-fake-entry gate:
  // a signal must come from a real, sufficiently large live sample,
  // show a meaningful edge over the 10% digit baseline, and have
  // separation from the next candidate.
  if (digits.length < MIN_TICKS_FOR_ANALYSIS) {
    return;
  }

  const fullCounts = Array(10).fill(0);
  digits.forEach(d => {
    if (Number.isInteger(d) && d >= 0 && d <= 9) fullCounts[d]++;
  });

  const fullRates = fullCounts.map(
    count => (count / digits.length) * 100
  );

  const recent = digits.slice(-20);
  const previous = digits.slice(-40, -20);

  if (recent.length < 20 || previous.length < 20) {
    return;
  }

  const recentCounts = Array(10).fill(0);
  const previousCounts = Array(10).fill(0);

  recent.forEach(d => recentCounts[d]++);
  previous.forEach(d => previousCounts[d]++);

  const recentRates = recentCounts.map(c => (c / recent.length) * 100);
  const previousRates = previousCounts.map(c => (c / previous.length) * 100);

  // Require the same leading digit to remain present across
  // consecutive live windows. This prevents a single burst of
  // ticks from being presented as a prediction.
  const stableDigits = new Set(
    recentRates
      .map((rate, digit) => ({ rate, digit }))
      .filter(x => x.rate >= MIN_TOP_DIGIT_RATE)
      .map(x => x.digit)
  );

  const stableCandidates = ranked.filter(item =>
    stableDigits.has(item.digit) &&
    previousRates[item.digit] >= MIN_TOP_DIGIT_RATE &&
    fullRates[item.digit] >= MIN_TOP_DIGIT_RATE
  );

  if (!stableCandidates.length) {
    return;
  }


  const contract =
    contractSelect.value;


  let candidates = [];
  let analysisReason = "";

  // Start from the statistically validated live candidates, not
  // from an arbitrary digit.
  const validatedRanked = stableCandidates;


  if (contract === "ODD") {

    candidates =
      validatedRanked.filter(
        item =>
          item.digit % 2 === 1
      );

    analysisReason =
      "The strongest live odd-digit momentum is leading the current analysis.";
  }


  else if (contract === "EVEN") {

    candidates =
      validatedRanked.filter(
        item =>
          item.digit % 2 === 0
      );

    analysisReason =
      "The strongest live even-digit momentum is leading the current analysis.";
  }


  else if (contract === "OVER") {

    const barrier =
      Number(
        barrierSelect.value
      );

    candidates =
      validatedRanked.filter(
        item =>
          item.digit > barrier
      );

    analysisReason =
      `Live momentum currently favors digits above barrier ${barrier}.`;
  }


  else if (contract === "UNDER") {

    const barrier =
      Number(
        barrierSelect.value
      );

    candidates =
      validatedRanked.filter(
        item =>
          item.digit < barrier
      );

    analysisReason =
      `Live momentum currently favors digits below barrier ${barrier}.`;
  }


  else if (contract === "DIFFERS") {

    candidates =
      validatedRanked.slice(0, 4);

    analysisReason =
      "These digits currently show the strongest live momentum candidates for a DIFFERS setup.";
  }


  else if (contract === "MATCHES") {

    if (!matchesUnlocked) {
      return;
    }

    candidates =
      validatedRanked.slice(0, 3);

    analysisReason =
      "These digits currently have the strongest live momentum for a MATCHES setup.";
  }


  if (!candidates.length) {
    return;
  }


  const top =
    candidates.slice(0, 3);


  const strongest =
    top[0];


  const second =
    top[1];


  const separation =
    second
      ? strongest.score - second.score
      : strongest.score;

  const strongestRate = fullRates[strongest.digit];
  const secondRate = second ? fullRates[second.digit] : 0;
  const edgeOverBaseline = strongestRate - 10;

  if (
    strongestRate < MIN_TOP_DIGIT_RATE ||
    edgeOverBaseline < MIN_EDGE_OVER_BASE ||
    (second && strongestRate - secondRate < MIN_TOP_MARGIN)
  ) {
    return;
  }


  const score =
    Math.min(
      95,
      Math.max(
        50,
        50 +
        strongest.score * 1.7 +
        separation * 0.8 +
        edgeOverBaseline * 1.5
      )
    );


  analysisScore.textContent =
    score.toFixed(0);


  if (
    score <
    SIGNAL_SCORE_THRESHOLD
  ) {

    return;
  }


  createEntrySignal({
    contract,
    // Show only the single strongest qualified digit from 0-9.
    digits: [strongest.digit],
    score,
    reason:
      analysisReason
  });
}


/* =========================================================
   CREATE SIGNAL
========================================================= */

function createEntrySignal({
  contract,
  digits: predictedDigits,
  score,
  reason: signalReason
}) {

  if (currentSignal) {
    return;
  }


  if (
    !running ||
    !currentMarket ||
    !currentSymbol
  ) {

    return;
  }


  signalSequence++;


  currentSignal = {

    id:
      signalSequence,

    market:
      currentMarket,

    symbol:
      currentSymbol,

    contract,

    digits:
      predictedDigits,

    score,

    reason:
      signalReason,

    createdAt:
      Date.now(),

    status:
      "ACTIVE"

  };


  analysisScore.textContent =
    score.toFixed(0);


  entryContract.textContent =
    contract + " • DIGIT " + predictedDigits[0];


  if (
    contract === "OVER" ||
    contract === "UNDER"
  ) {

    const barrier =
      Number(
        barrierSelect.value
      );

    prediction.textContent =
      `${contract} ${barrier}`;

    manualHelp.textContent =
      `Manual: choose ${contract} and set barrier ${barrier} on Deriv.`;

  } else {

    prediction.textContent =
      predictedDigits.join(" • ");

    manualHelp.textContent =
      `Manual: choose ${contract} and enter/select one of the shown digit(s) on Deriv.`;
  }


  reason.textContent =
    signalReason;


  manualTradeButton.disabled =
    false;


  hideDontTrade();


  startEntryTimer(
    currentSignal.id
  );


  playSignalSound();
}


/* =========================================================
   TIMER
========================================================= */

function startEntryTimer(signalId) {

  clearTimer();

  entrySeconds = 60;

  timer.classList.remove(
    "warning",
    "expired"
  );

  timer.classList.add(
    "active"
  );

  timerValue.textContent =
    `${entrySeconds}s`;


  entryTimer =
    setInterval(
      () => {

        if (
          !currentSignal ||
          currentSignal.id !== signalId
        ) {

          clearTimer();
          return;
        }


        if (!running) {

          clearTimer();
          return;
        }


        entrySeconds--;


        if (
          entrySeconds <= 0
        ) {

          clearTimer();

          finishEntryWindow(
            signalId
          );

          return;
        }


        timerValue.textContent =
          `${entrySeconds}s`;


        if (
          entrySeconds <= 10
        ) {

          timer.classList.remove(
            "active"
          );

          timer.classList.add(
            "warning"
          );
        }

      },
      1000
    );
}


/* =========================================================
   TIMER FINISHED
========================================================= */

function finishEntryWindow(signalId) {

  if (
    !currentSignal ||
    currentSignal.id !== signalId
  ) {

    return;
  }


  currentSignal.status =
    "EXPIRED";


  manualTradeButton.disabled =
    true;


  timer.classList.remove(
    "active",
    "warning"
  );

  timer.classList.add(
    "expired"
  );


  timerValue.textContent =
    "0s";


  showDontTrade(
    "Entry time finished. Wait for a new confirmed signal."
  );


  currentSignal = null;


  resetEntryBoxOnly();


  /*
   * IMPORTANT:
   *
   * Keep the remaining history temporarily.
   * But require NEW ticks before another signal.
   */
  digits = [];
  ticks = [];

  tickCount.textContent = "0";
  lastDigit.textContent = "—";
  analysisScore.textContent = "—";

  digitHistory.textContent =
    "Waiting for fresh live ticks...";

  updateMomentum();
}


/* =========================================================
   STOP CURRENT SIGNAL
========================================================= */

function stopCurrentSignal() {

  clearEntryDigitHighlights();

  if (currentSignal) {

    currentSignal.status =
      "CANCELLED";
  }


  currentSignal = null;

  manualTradeButton.disabled =
    true;
}


/* =========================================================
   CLEAR TIMER
========================================================= */

function clearTimer() {

  if (entryTimer) {

    clearInterval(
      entryTimer
    );

    entryTimer = null;
  }


  entrySeconds = 0;


  timer.classList.remove(
    "active",
    "warning",
    "expired"
  );


  timerValue.textContent =
    "—";
}


/* =========================================================
   RESET ANALYSIS
========================================================= */

function resetAnalysis() {

  ticks = [];
  digits = [];

  tickCount.textContent =
    "0";

  lastDigit.textContent =
    "—";

  analysisScore.textContent =
    "—";

  digitHistory.textContent =
    "Waiting for fresh live ticks...";

  resetEntryBox();

  updateMomentum();
}


/* =========================================================
   RESET ENTRY
========================================================= */

function resetEntryBox() {

  clearEntryDigitHighlights();
  setEntryDigitAnimation(running);

  entryContract.textContent =
    "WAITING FOR CONFIRMED ENTRY";

  prediction.textContent =
    "—";

  reason.textContent =
    "The analyzer is waiting for enough live ticks.";

  manualHelp.textContent =
    "No manual entry yet.";

  manualTradeButton.disabled =
    true;
}


function resetEntryBoxOnly() {

  clearEntryDigitHighlights();
  setEntryDigitAnimation(false);

  entryContract.textContent =
    "ENTRY FINISHED";

  prediction.textContent =
    "—";

  reason.textContent =
    "Wait for a new confirmed signal.";

  manualHelp.textContent =
    "Do not use the previous entry.";

  manualTradeButton.disabled =
    true;
}


/* =========================================================
   DON'T TRADE
========================================================= */

function showDontTrade(message) {

  dontMessage.textContent =
    message;

  dontTrade.classList.add(
    "show"
  );
}


function hideDontTrade() {

  dontTrade.classList.remove(
    "show"
  );
}


/* =========================================================
   DIGIT HISTORY
========================================================= */

function renderDigitHistory() {

  if (!digits.length) {

    digitHistory.textContent =
      "No ticks yet.";

    return;
  }


  const recent =
    digits.slice(-30);


  digitHistory.innerHTML =
    recent
      .map(
        digit => {

          const span =
            document.createElement(
              "span"
            );

          span.style.display =
            "inline-flex";

          span.style.alignItems =
            "center";

          span.style.justifyContent =
            "center";

          span.style.width =
            "28px";

          span.style.height =
            "28px";

          span.style.margin =
            "3px";

          span.style.borderRadius =
            "50%";

          span.style.background =
            "#13263e";

          span.style.fontWeight =
            "800";

          span.textContent =
            digit;

          return span.outerHTML;
        }
      )
      .join("");
}


/* =========================================================
   MANUAL TRADE
========================================================= */

manualTradeButton.addEventListener(
  "click",
  () => {

    if (!currentSignal) {
      return;
    }


    if (entrySeconds <= 0) {
      return;
    }


    const signal =
      currentSignal;


    if (
      signal.market !== currentMarket ||
      signal.symbol !== currentSymbol
    ) {

      showDontTrade(
        "Market changed. This entry is no longer valid."
      );

      stopCurrentSignal();
      clearTimer();

      return;
    }


    const record = {

      id:
        Date.now(),

      market:
        signal.market,

      symbol:
        signal.symbol,

      contract:
        signal.contract,

      digits:
        signal.digits,

      score:
        Number(
          signal.score.toFixed(1)
        ),

      reason:
        signal.reason,

      entryTime:
        new Date().toISOString(),

      result:
        "PENDING"
    };


    saveTrade(record);


    alert(
      "Manual trade recorded. Place the trade yourself on Deriv."
    );
  }
);


/* =========================================================
   TRADE STORAGE
========================================================= */

function getTrades() {

  try {

    const raw =
      localStorage.getItem(
        "derivLiveEntryTrades"
      );

    const parsed =
      JSON.parse(
        raw || "[]"
      );

    return Array.isArray(parsed)
      ? parsed
      : [];

  } catch {

    return [];
  }
}


function saveTrade(record) {

  const trades =
    getTrades();


  trades.unshift(record);


  localStorage.setItem(
    "derivLiveEntryTrades",
    JSON.stringify(
      trades.slice(0, 100)
    )
  );


  renderTradeHistory();
}


/* =========================================================
   WIN / LOSS
========================================================= */

window.setTradeResult =
  function setTradeResult(
    id,
    result
  ) {

    if (
      result !== "WIN" &&
      result !== "LOSS"
    ) {

      return;
    }


    const trades =
      getTrades();


    const trade =
      trades.find(
        item =>
          item.id === id
      );


    if (!trade) {
      return;
    }


    trade.result =
      result;


    localStorage.setItem(
      "derivLiveEntryTrades",
      JSON.stringify(trades)
    );


    renderTradeHistory();
  };


/* =========================================================
   TRADE HISTORY
========================================================= */

function renderTradeHistory() {

  const trades =
    getTrades();


  if (!trades.length) {

    tradeHistory.textContent =
      "No manual trades recorded.";

    return;
  }


  tradeHistory.innerHTML =
    trades
      .map(
        trade => {

          const digitsText =
            Array.isArray(
              trade.digits
            )
              ? trade.digits.join(
                  " • "
                )
              : "—";


          const resultClass =
            trade.result === "WIN"
              ? "win"
              : trade.result === "LOSS"
                ? "loss"
                : "";


          const safeMarket =
            escapeHtml(
              trade.market
            );

          const safeContract =
            escapeHtml(
              trade.contract
            );

          const safeDigits =
            escapeHtml(
              digitsText
            );


          let actionHtml = "";


          if (
            trade.result ===
            "PENDING"
          ) {

            actionHtml = `
              <button
                onclick="setTradeResult(${Number(trade.id)}, 'WIN')"
                style="
                  padding:6px 8px;
                  font-size:10px;
                  margin:2px;
                "
              >
                WIN
              </button>

              <button
                onclick="setTradeResult(${Number(trade.id)}, 'LOSS')"
                style="
                  padding:6px 8px;
                  font-size:10px;
                  background:#9b2432;
                  margin:2px;
                "
              >
                LOSS
              </button>
            `;

          } else {

            actionHtml =
              new Date(
                trade.entryTime
              ).toLocaleTimeString();
          }


          return `
            <div class="history-row">

              <div>
                <strong>
                  ${safeMarket}
                </strong>
                <br>
                ${safeContract}
              </div>

              <div>
                ${safeDigits}
                <br>
                Score:
                ${Number(trade.score) || 0}
              </div>

              <div class="${resultClass}">
                ${escapeHtml(trade.result)}
              </div>

              <div>
                ${actionHtml}
              </div>

            </div>
          `;
        }
      )
      .join("");
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;


function prepareAudio() {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();
    }


    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();
    }

  } catch {}
}


function playSignalSound() {

  try {

    if (!audioContext) {
      return;
    }


    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    oscillator.frequency.value =
      880;

    oscillator.type =
      "sine";


    gain.gain.setValueAtTime(
      0.001,
      audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.15,
      audioContext.currentTime + 0.02
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + 0.3
    );


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime + 0.3
    );

  } catch {}
}


/* =========================================================
   INITIAL
========================================================= */

renderTradeHistory();

updateBarrierVisibility();

updateMomentum();

</script>
